<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Airhorn</title>
<meta name="description" content="Ein Knopf, ein Sound: HONK.">
<meta name="theme-color" content="#eceaff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06071c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Airhorn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceaff;
    --bg-deep: #d9d4ff;
    --fg: #1a1450;
    --muted: #5a5396;
    --core: #f7f5ff;
    --a: #00b8d9;
    --b: #8a2cff;
    --c: #ff2fa8;
    --glow-strength: .55;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #06071c;
      --bg-deep: #120a3a;
      --fg: #eaf6ff;
      --muted: #8f9ad8;
      --core: #0a0b26;
      --a: #36e6ff;
      --b: #9d4dff;
      --c: #ff3db8;
      --glow-strength: 1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #06071c;
    --bg-deep: #120a3a;
    --fg: #eaf6ff;
    --muted: #8f9ad8;
    --core: #0a0b26;
    --a: #36e6ff;
    --b: #9d4dff;
    --c: #ff3db8;
    --glow-strength: 1;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: radial-gradient(120% 80% at 50% 45%, var(--bg-deep), var(--bg) 70%);
    background-color: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas#fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .stage {
    position: relative;
    z-index: 1;
    width: min(66vw, 300px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }
  /* rotierender Leuchtring */
  .rim {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from var(--spin, 0deg), var(--a), var(--b), var(--c), var(--a));
    filter: blur(calc(18px * var(--glow-strength)));
    opacity: .75;
    animation: spin 6s linear infinite;
  }
  .rim.sharp {
    inset: -3px;
    filter: none;
    opacity: 1;
  }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --spin: 360deg; } }
  .stage.hit .rim:not(.sharp) { animation: spin 6s linear infinite, flare .45s ease-out; }
  @keyframes flare {
    0%   { opacity: 1; inset: -34px; filter: blur(34px); }
    100% { opacity: .75; }
  }
  #horn {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: none;
    background:
      radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--b) 22%, transparent), transparent 60%),
      var(--core);
    color: var(--fg);
    font-family: "Michroma", "Eurostile", "Segoe UI", sans-serif;
    font-size: clamp(1.6rem, 8.5vw, 2.6rem);
    letter-spacing: .08em;
    text-shadow:
      0 0 calc(10px * var(--glow-strength)) var(--a),
      0 0 calc(26px * var(--glow-strength)) var(--b);
    box-shadow: inset 0 0 40px color-mix(in srgb, var(--b) 35%, transparent);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .06s ease-out;
  }
  #horn.pressed { transform: scale(.94); }
  #horn:focus-visible { outline: 2px solid var(--a); outline-offset: 16px; }
  p {
    position: relative;
    z-index: 1;
    margin: 0;
    color: var(--muted);
    font-size: .95rem;
    letter-spacing: .02em;
    text-align: center;
    padding: 0 1.5rem;
  }
  @media (prefers-reduced-motion: reduce) {
    .rim { animation: none; }
    .stage.hit .rim:not(.sharp) { animation: none; }
    #horn { transition: none; }
  }
</style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="stage" id="stage">
    <div class="rim"></div>
    <div class="rim sharp"></div>
    <button id="horn" type="button" aria-label="Airhorn abspielen">HONK</button>
  </div>
  <p>Jeder Druck startet den Sound von vorn.</p>

<script>
(() => {
  /* ---------- Audio ---------- */
  const SOUND = "airhorn.wav";
  let ctx = null, buffer = null, loading = null, current = null;

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }
  function load() {
    if (buffer) return Promise.resolve(buffer);
    if (loading) return loading;
    const ac = getCtx();
    loading = fetch(SOUND)
      .then(r => r.arrayBuffer())
      .then(data => new Promise((res, rej) => ac.decodeAudioData(data, res, rej)))
      .then(b => { buffer = b; return b; })
      .catch(err => { loading = null; throw err; });
    return loading;
  }
  function play() {
    const ac = getCtx();
    if (ac.state === "suspended") ac.resume();
    if (current) {
      try { current.stop(); } catch (e) {}
      current.disconnect();
      current = null;
    }
    const start = b => {
      const src = ac.createBufferSource();
      src.buffer = b;
      src.connect(ac.destination);
      src.start();
      current = src;
      src.onended = () => { if (current === src) current = null; };
    };
    buffer ? start(buffer) : load().then(start).catch(() => {});
  }
  load().catch(() => {});

  /* ---------- Partikel ---------- */
  const canvas = document.getElementById("fx");
  const g = canvas.getContext("2d");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1;
  const sparks = [];
  const waves = [];
  const dust = [];

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  let palette = [];
  function readPalette() { palette = [cssVar("--a"), cssVar("--b"), cssVar("--c")]; }
  readPalette();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", readPalette);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  if (!reduced) {
    for (let i = 0; i < 60; i++) {
      dust.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .15, vy: -Math.random() * .25 - .05,
        r: Math.random() * 1.4 + .3, tw: Math.random() * Math.PI * 2,
        c: Math.floor(Math.random() * 3)
      });
    }
  }

  function center() {
    const r = btn.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, rad: r.width / 2 };
  }

  function burst() {
    const { x, y, rad } = center();
    const n = reduced ? 18 : 110;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (Math.random() * 7 + 3) * (reduced ? .5 : 1);
      sparks.push({
        x: x + Math.cos(a) * rad * .9,
        y: y + Math.sin(a) * rad * .9,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: Math.random() * .018 + .012,
        r: Math.random() * 2.2 + .8,
        c: Math.floor(Math.random() * 3)
      });
    }
    waves.push({ x, y, r: rad, life: 1 });
    if (!reduced) waves.push({ x, y, r: rad * .8, life: 1, delay: 6 });
  }

  function frame() {
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = "lighter";

    for (const d of dust) {
      d.x += d.vx; d.y += d.vy; d.tw += .03;
      if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; }
      if (d.x < -5) d.x = W + 5; else if (d.x > W + 5) d.x = -5;
      g.globalAlpha = .25 + Math.sin(d.tw) * .2;
      g.fillStyle = palette[d.c];
      g.beginPath(); g.arc(d.x, d.y, d.r, 0, Math.PI * 2); g.fill();
    }

    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i];
      if (w.delay) { w.delay--; continue; }
      w.r += 9; w.life -= .03;
      if (w.life <= 0) { waves.splice(i, 1); continue; }
      g.globalAlpha = w.life * .8;
      g.strokeStyle = palette[0];
      g.lineWidth = 3 * w.life + .5;
      g.shadowColor = palette[1];
      g.shadowBlur = 20;
      g.beginPath(); g.arc(w.x, w.y, w.r, 0, Math.PI * 2); g.stroke();
      g.shadowBlur = 0;
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      const px = s.x, py = s.y;
      s.vx *= .955; s.vy = s.vy * .955 + .05;
      s.x += s.vx; s.y += s.vy;
      s.life -= s.decay;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      g.globalAlpha = s.life;
      g.strokeStyle = palette[s.c];
      g.lineWidth = s.r;
      g.lineCap = "round";
      g.beginPath(); g.moveTo(px - s.vx * 1.5, py - s.vy * 1.5); g.lineTo(s.x, s.y); g.stroke();
      g.fillStyle = "#ffffff";
      g.globalAlpha = s.life * .7;
      g.beginPath(); g.arc(s.x, s.y, s.r * .45, 0, Math.PI * 2); g.fill();
    }

    g.globalAlpha = 1;
    g.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }

  /* ---------- Bedienung ---------- */
  const btn = document.getElementById("horn");
  const stage = document.getElementById("stage");
  requestAnimationFrame(frame);

  function fire() {
    play();
    burst();
    stage.classList.remove("hit");
    void stage.offsetWidth;
    stage.classList.add("hit");
    if (navigator.vibrate) navigator.vibrate(30);
  }

  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    btn.classList.add("pressed");
    fire();
  });
  const release = () => btn.classList.remove("pressed");
  btn.addEventListener("pointerup", release);
  btn.addEventListener("pointerleave", release);
  btn.addEventListener("pointercancel", release);
  btn.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (e.repeat) return;
      btn.classList.add("pressed");
      fire();
    }
  });
  btn.addEventListener("keyup", release);
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
